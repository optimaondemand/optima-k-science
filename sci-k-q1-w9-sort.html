<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sort the Seasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFCF4;
    --plum:#3A2E39;
    --spring:#8BD17C;
    --summer:#FFC94D;
    --fall:#FF8C42;
    --winter:#6FC3E8;
    --grass:#5FBF6F;
    --card-shadow: 0 6px 0 rgba(58,46,57,0.15);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Baloo 2', system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 12%, #FFF3D0 0%, transparent 42%),
      radial-gradient(circle at 88% 88%, #E1F5FF 0%, transparent 45%),
      var(--cream);
    color:var(--plum);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
    overflow-x:hidden;
  }
  h1{
    font-size:clamp(1.4rem, 5vw, 2rem);
    font-weight:800;
    margin:4px 0 2px;
    text-align:center;
  }
  .sub{
    font-size:1rem;
    font-weight:500;
    color:#6b5c68;
    margin:0 0 16px;
    text-align:center;
    max-width:360px;
  }
  .dots{
    display:flex;
    gap:6px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:420px;
  }
  .dot{
    width:16px;height:16px;border-radius:50%;
    background:#E9E2D6;
    border:2px solid #d8cfc0;
    transition:transform .25s;
  }
  .dot.done{background:var(--grass); border-color:var(--grass); transform:scale(1.15);}

  .stage{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .card{
    background:#fff;
    border:3px solid var(--plum);
    border-radius:24px;
    box-shadow:var(--card-shadow);
    padding:22px 18px;
    width:min(300px, 84vw);
    text-align:center;
  }
  .card-label{
    font-size:1rem;
    font-weight:700;
    color:#8a7c86;
    margin-bottom:10px;
  }
  .item-emoji{
    font-size:4.5rem;
    line-height:1;
  }

  .bins{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    max-width:340px;
  }
  .bin{
    background:var(--spring);
    border:3px solid var(--plum);
    border-radius:20px;
    padding:14px 8px;
    text-align:center;
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
    box-shadow:var(--card-shadow);
    transition:transform .15s ease;
    color:#3A2E39;
  }
  .bin .icon{font-size:1.8rem; display:block; margin-bottom:2px;}
  .bin[data-value="summer"]{background:var(--summer);}
  .bin[data-value="fall"]{background:var(--fall); color:#fff;}
  .bin[data-value="winter"]{background:var(--winter);}
  .bin:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(58,46,57,0.15);}

  .feedback{
    min-height:34px;
    font-size:1.1rem;
    font-weight:700;
    text-align:center;
  }
  .feedback.good{color:var(--grass);}
  .feedback.bad{color:#E0577B;}

  .done-screen{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .done-screen .big-emoji{font-size:4rem;}
  button.again{
    font-family:inherit;
    font-size:1.1rem;
    font-weight:800;
    color:#fff;
    background:var(--fall);
    border:none;
    border-radius:16px;
    padding:14px 28px;
    cursor:pointer;
    box-shadow:0 5px 0 #c9631d;
  }
  button.again:active{transform:translateY(4px); box-shadow:none;}

  .confetti{
    position:fixed; top:-20px; font-size:1.6rem;
    animation: fall linear forwards;
    pointer-events:none;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:0.9; }
  }

  @media (prefers-reduced-motion: reduce){
    .bin, button.again, .confetti{ transition:none; animation:none; }
  }
</style>
</head>
<body>

  <h1>Sort the Seasons</h1>
  <p class="sub" id="subtext">Look at the picture, then tap the season it belongs to.</p>
  <div class="dots" id="dots"></div>

  <div class="stage" id="stage"></div>

<script>
const ITEM_BANK = [
  {emoji:"🌷", name:"a tulip blooming", season:"spring"},
  {emoji:"🐣", name:"a hatching chick", season:"spring"},
  {emoji:"🌧️", name:"a spring rain shower", season:"spring"},
  {emoji:"☀️", name:"a hot sunny day", season:"summer"},
  {emoji:"🍦", name:"an ice cream cone", season:"summer"},
  {emoji:"🍉", name:"a slice of watermelon", season:"summer"},
  {emoji:"🍂", name:"leaves falling off trees", season:"fall"},
  {emoji:"🎃", name:"a pumpkin", season:"fall"},
  {emoji:"🌰", name:"an acorn", season:"fall"},
  {emoji:"⛄", name:"a snowman", season:"winter"},
  {emoji:"❄️", name:"a snowflake", season:"winter"},
  {emoji:"🧤", name:"a warm mitten", season:"winter"}
];

const SEASON_INFO = {
  spring: {label:"Spring", icon:"🌱"},
  summer: {label:"Summer", icon:"☀️"},
  fall: {label:"Fall", icon:"🍁"},
  winter: {label:"Winter", icon:"❄️"}
};

let order = [];
let current = 0;

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const subtext = document.getElementById('subtext');

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDots(){
  dotsEl.innerHTML = '';
  order.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    dotsEl.appendChild(d);
  });
}

function startGame(){
  order = shuffle(ITEM_BANK);
  current = 0;
  subtext.textContent = "Look at the picture, then tap the season it belongs to.";
  buildDots();
  renderRound();
}

function renderRound(){
  if(current >= order.length){
    renderDone();
    return;
  }
  const item = order[current];
  const binHtml = Object.keys(SEASON_INFO).map(key => {
    const s = SEASON_INFO[key];
    return `<div class="bin" data-value="${key}"><span class="icon">${s.icon}</span>${s.label}</div>`;
  }).join('');
  stage.innerHTML = `
    <div class="card">
      <div class="card-label">What season is this?</div>
      <div class="item-emoji">${item.emoji}</div>
    </div>
    <div class="bins">${binHtml}</div>
    <div class="feedback" id="feedback"></div>
  `;
  document.querySelectorAll('.bin').forEach(bin => {
    bin.addEventListener('click', () => handleBin(bin.dataset.value));
  });
}

function handleBin(value){
  const item = order[current];
  const feedback = document.getElementById('feedback');
  if(value === item.season){
    feedback.textContent = "Yes! " + item.name + " is " + SEASON_INFO[item.season].label + "! 🎉";
    feedback.className = 'feedback good';
    document.getElementById('dot-' + current).classList.add('done');
    setTimeout(() => { current++; renderRound(); }, 900);
  } else {
    feedback.textContent = "Think again — what season is that?";
    feedback.className = 'feedback bad';
  }
}

function renderDone(){
  subtext.textContent = "You sorted every season!";
  stage.innerHTML = `
    <div class="done-screen">
      <div class="big-emoji">🌈</div>
      <div style="font-size:1.3rem; font-weight:800;">Great sorting!</div>
      <div>You sorted all ${order.length} pictures into the four seasons.</div>
      <button class="again" id="againBtn">Play again</button>
    </div>
  `;
  document.getElementById('againBtn').addEventListener('click', startGame);
  launchConfetti();
}

function launchConfetti(){
  const emojis = ['🎉','🍂','❄️','🌸','☀️'];
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (2 + Math.random()*1.5) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

startGame();
</script>
</body>
</html>
